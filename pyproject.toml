[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "daicheck"
version = "0.1.0"
description = "Validator and information tool for DAI architecture files"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
daicheck = "daicheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
